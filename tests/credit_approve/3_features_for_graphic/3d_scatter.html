<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const D = P.ratios.map(r => Math.pow(10, r));
const scale = M => M.map(r => r.map((v,i) => +(v/D[i]).toFixed(3)));
const S = scale(P.X), ST = scale(P.Xt);

const lim = [0,1,2].map(i => {
  const c = P.X.map(r => r[i]);
  return [Math.min(...c), Math.max(...c)];
});
const outlier = P.Xt.map(r => r.some((v,i) => v < lim[i][0] || v > lim[i][1]));

const BLUE = '#2a78d6', ORANGE = '#eb6834';

function trace(pts, keep, name, color, style) {
  const idx = keep.map((k,i) => k ? i : -1).filter(i => i >= 0);
  return {
    type:'scatter3d', mode:'markers', name,
    x: idx.map(i => pts[i][0]),
    y: idx.map(i => pts[i][1]),
    z: idx.map(i => pts[i][2]),
    marker: Object.assign({color}, style),
    hovertemplate: name + '<br>yaş %{x}<br>gelir %{y}<br>skor %{z}<extra></extra>'
  };
}

const faint = { size:3, symbol:'circle', opacity:0.22 };
const bold  = { size:8, symbol:'diamond', opacity:1, line:{color:'#ffffff', width:1} };
const ring  = { size:10, symbol:'diamond-open', opacity:1, line:{width:3} };

function build() {
  const train = document.getElementById('showTrain').checked;
  const test  = document.getElementById('showTest').checked;
  const outl  = document.getElementById('showOutlier').checked;
  const t = [];
  if (train) {
    t.push(trace(S, P.y.map(v => v === 0), 'eğitim y=0', BLUE, faint));
    t.push(trace(S, P.y.map(v => v === 1), 'eğitim y=1', ORANGE, faint));
  }
  if (test) {
    const ok = P.yt.map((v,i) => outl || !outlier[i]);
    t.push(trace(ST, P.yt.map((v,i) => v === 0 && ok[i]), 'test y=0', BLUE, bold));
    t.push(trace(ST, P.yt.map((v,i) => v === 1 && ok[i]), 'test y=1', ORANGE, bold));
    if (outl) t.push(trace(ST, outlier, 'aralık dışı', '#8a8880', ring));
  }
  Plotly.react('plot', t, layout, {responsive:true, displayModeBar:false});
}

const axis = title => ({
  title: { text:title, font:{size:13, color:'#6b6a65'} },
  tickfont: { size:11, color:'#6b6a65' },
  gridcolor: '#e2e0d8', zerolinecolor: '#d5d3ca',
  backgroundcolor: '#fdfdfc', showbackground: true
});

const layout = {
  margin: {l:0, r:0, t:0, b:0},
  showlegend: false,
  paper_bgcolor: '#ffffff',
  scene: {
    xaxis: axis(P.names[0]),
    yaxis: axis(P.names[1]),
    zaxis: axis(P.names[2]),
    camera: { eye:{x:1.6, y:1.5, z:0.9} }
  }
};

['showTrain','showTest','showOutlier'].forEach(id =>
  document.getElementById(id).addEventListener('change', build));
build();
</script>
